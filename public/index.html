<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JKMusic — Sound System Rental</title>
  <meta name="description" content="JKMusic — sound system rental with crew, delivery and setup. 30 years of live events in Thailand.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ NAV ============ -->
<header id="nav">
  <div class="nav-pill">
    <a href="#home" class="logo" aria-label="JKMusic home">
      <img id="logoImg" alt="" onerror="this.remove()">
      <span id="logoName"></span>
    </a>
    <nav id="menu">
      <a href="#packages"  data-nav="packages"></a>
      <a href="#inventory" data-nav="inventory"></a>
      <a href="#portfolio" data-nav="portfolio"></a>
      <a href="#faq"       data-nav="faq"></a>
    </nav>
    <div class="nav-right">
      <button id="langBtn" class="lang" aria-label="Switch language">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span id="langTxt">TH</span>
      </button>
      <a href="#contact" class="btn sm" data-nav="quote"></a>
      <button id="burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    </div>
  </div>
</header>

<main>

<!-- ============ HERO: left headline (Linear) + floating photos + changing word ============ -->
<section id="home" class="hero">
  <div class="float-layer" id="floatLayer" aria-hidden="true"></div>
  <div class="wrap hero-core" id="heroCore">
    <p class="kicker" id="heroSub"></p>
    <h1><span id="heroLine1"></span><br><span class="rot" id="heroRot"><span class="rot-word"></span></span></h1>
    <p class="lead" id="heroTag"></p>
    <div class="hero-btns">
      <a href="#contact" class="btn" id="heroCta1"></a>
      <a href="#packages" class="btn ghost" id="heroCta2"></a>
    </div>
  </div>
  <a href="#sheetWin" class="scroll-cue" id="scrollCue">
    <span data-ui="hero.scroll"></span>
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 7l5 5 5-5M7 13l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</section>

<!-- ============ EVENT SHEET: the "product window" ============ -->
<section class="win-sec" id="sheetWin">
  <div class="wrap">
    <div class="win" id="win"></div>
  </div>
</section>

<!-- ============ INTRO: photos inside the headline ============ -->
<section id="intro" class="intro">
  <div class="wrap center">
    <h2 class="inline-photo" id="introTitle"></h2>
    <p class="sub" data-ui="intro.sub"></p>
    <div class="stats" id="stats"></div>
  </div>
</section>

<!-- ============ PACKAGES: pinned showcase ============ -->
<section id="packages" class="showcase-sec">
  <div class="wrap head center">
    <p class="tag-label" data-nav="packages"></p>
    <h2 class="title" data-ui="packages.title"></h2>
    <p class="sub" data-ui="packages.sub"></p>
  </div>
  <div class="pin-track" id="pinTrack">
    <div class="pin-stage">
      <div class="spot" aria-hidden="true"></div>
      <div class="wrap pin-grid">
        <ol class="pin-list" id="pinList"></ol>
        <div class="pin-card-wrap" id="pinCards"></div>
      </div>
    </div>
  </div>
  <p class="wrap pkg-foot" data-ui="packages.foot"></p>
</section>

<!-- ============ DARK: worries as sticky notes, then a white sheet slides over ============ -->
<section class="dark-sec" id="worries">
  <div class="wrap center">
    <h2 class="title light" data-ui="worries.title"></h2>
    <p class="sub light" data-ui="worries.sub"></p>
    <div class="notes" id="notes"></div>
  </div>

  <div class="sheet">
    <div class="wrap">
      <h2 class="title center sheet-title"><span data-ui="worries.answer1"></span><br><u data-ui="worries.answer2"></u></h2>
      <div class="promise" id="aboutPoints"></div>
    </div>
  </div>
</section>

<!-- ============ INVENTORY ============ -->
<section id="inventory" class="section">
  <div class="wrap">
    <div class="head split">
      <div>
        <p class="tag-label" data-nav="inventory"></p>
        <h2 class="title" data-ui="inventory.title"></h2>
        <p class="sub" data-ui="inventory.sub"></p>
      </div>
      <div class="filters" id="invFilters" role="tablist"></div>
    </div>
    <div class="inv-grid" id="inventoryShowcaseGrid"></div>
    <div class="more" id="invMore"></div>
  </div>
</section>

<!-- ============ PORTFOLIO: sideways row ============ -->
<section id="portfolio" class="section tight">
  <div class="wrap head split">
    <div>
      <p class="tag-label" data-nav="portfolio"></p>
      <h2 class="title" data-ui="portfolio.title"></h2>
      <p class="sub" data-ui="portfolio.sub"></p>
    </div>
    <div class="row-arrows">
      <button class="round" id="workPrev" aria-label="Previous events"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="round" id="workNext" aria-label="Next events"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <div class="work-row" id="portfolioGrid"></div>
</section>

<!-- ============ DARK: how booking works ============ -->
<section id="about" class="dark-sec steps-sec">
  <div class="wrap">
    <p class="tag-label center" data-ui="about.howTitle"></p>
    <h2 class="title light center" data-ui="process.title"></h2>
    <div class="feat" id="aboutSteps"></div>
  </div>
</section>

<!-- ============ FAQ ============ -->
<section id="faq" class="section">
  <div class="wrap faq">
    <div>
      <p class="tag-label" data-nav="faq"></p>
      <h2 class="title" data-ui="faq.title"></h2>
      <p class="sub" data-ui="faq.sub"></p>
      <a class="btn ghost" id="faqLine" target="_blank" rel="noopener" data-ui="faq.cta"></a>
    </div>
    <div class="faq-list" id="faqList"></div>
  </div>
</section>

<!-- ============ FINAL CTA + CONTACT ============ -->
<section id="contact" class="final">
  <div class="final-bg" id="finalBg" aria-hidden="true"></div>
  <div class="wrap final-core">
    <h2 class="final-title"><span data-ui="contact.title"></span><br><span class="dim" data-ui="contact.title2"></span></h2>
    <p class="final-sub" data-ui="contact.sub"></p>
    <div class="final-btns">
      <a class="btn white" id="finalLine" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3.3 6.5L4 20l1.3-3.6A8 8 0 0 1 4 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span data-ui="contact.line"></span>
      </a>
      <a class="btn outline-light" id="finalFw" target="_blank" rel="noopener" data-ui="contact.fw"></a>
    </div>

    <div class="contact-grid">
      <ul class="info" id="contactInfo"></ul>
      <div class="qr-grid" id="qrBox"></div>
    </div>
  </div>

  <footer class="wrap foot">
    <p><b id="footName"></b> <span id="footAddr"></span></p>
    <div class="socials" id="socials"></div>
    <p class="tiny">© <span id="year"></span> <span id="footName2"></span>. <span data-ui="footer.rights"></span></p>
  </footer>
</section>

</main>

<!-- ============ GEAR POPUP ============ -->
<div id="specModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="specTitle">
  <div class="modal-box">
    <button class="m-close" id="specClose" aria-label="Close">&times;</button>
    <div class="spec-img" id="specImg"></div>
    <div class="m-info">
      <span class="m-cat" id="specCat"></span>
      <h3 id="specTitle"></h3>
      <p class="m-desc" id="specDesc"></p>
      <h4 id="specHead"></h4>
      <ul class="m-list" id="specList"></ul>
      <a href="#contact" class="btn full" id="specCta"></a>
    </div>
  </div>
</div>

<!-- ============ EVENT POPUP ============ -->
<div id="evtModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="evtTitle">
  <div class="modal-box wide">
    <button class="m-close" id="evtClose" aria-label="Close">&times;</button>
    <div class="evt-gallery">
      <div class="evt-track" id="evtTrack"></div>
      <button class="round evt-nav prev" id="evtPrev" aria-label="Previous"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="round evt-nav next" id="evtNext" aria-label="Next"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span class="evt-count" id="evtCount"></span>
      <div class="evt-dots" id="evtDots"></div>
    </div>
    <div class="m-info">
      <span class="m-cat" id="evtCat"></span>
      <h3 id="evtTitle"></h3>
      <p class="m-desc" id="evtMeta"></p>
      <div class="tags" id="evtTags"></div>
      <h4 id="evtHead"></h4>
      <ul class="m-list" id="evtSetup"></ul>
      <a href="#contact" class="btn full" id="evtCta"></a>
    </div>
  </div>
</div>

<div id="lightbox" class="lightbox">
  <button class="m-close" aria-label="Close">&times;</button>
  <img id="lbImg" alt="">
  <p id="lbCap"></p>
</div>

<!-- ============ FLOATING FASTWORK BADGE ============ -->
<aside class="fw-float" id="fwFloat">
  <img src="images/logo.png" alt="" class="fw-avatar">
  <div class="fw-txt">
    <p><span data-ui="fastwork.avail"></span> <img id="fwIcon" alt="" class="fw-mark"><b>fastwork</b></p>
  </div>
  <a class="btn sm" id="fwFloatBtn" target="_blank" rel="noopener" data-ui="fastwork.cta"></a>
  <button class="fw-x" id="fwClose" aria-label="Hide">&times;</button>
</aside>

<script src="data.js"></script>
<script src="defaults.js"></script>
<script src="firebase-config.js"></script>
<script src="cms.js"></script>
</body>
</html>
