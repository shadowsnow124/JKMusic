<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>JKMusic CMS</title>
  <link rel="icon" href="../images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- sign-in / setup / blocked screens -->
<div class="gate" id="gate">
  <div class="gate-card">
    <img src="../images/logo.png" alt="" class="gate-logo">
    <h1>JKMusic CMS</h1>
    <p id="gateMsg">Sign in to edit your website.</p>
    <button class="btn" id="signIn" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#fff" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#fff" opacity=".85" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#fff" opacity=".7" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path fill="#fff" opacity=".55" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z"/></svg>
      Sign in with Google
    </button>
    <button class="btn ghost" id="signOutGate" hidden>Sign out</button>
    <a class="gate-link" href="../">Back to website</a>
  </div>
</div>

<!-- the editor -->
<div class="app" id="app" hidden>
  <header class="top">
    <button class="icon-btn" id="menuBtn" aria-label="Sections">☰</button>
    <a class="brand" href="../" target="_blank" rel="noopener"><img src="../images/logo.png" alt=""><b>JKMusic</b><span>CMS</span></a>
    <div class="top-right">
      <span class="status" id="status"></span>
      <a class="btn ghost sm" href="../" target="_blank" rel="noopener">View site</a>
      <button class="btn sm" id="saveBtn" disabled>Save &amp; publish</button>
      <button class="user" id="userBtn" title="Sign out"><img id="userPic" alt=""><span id="userMail"></span></button>
    </div>
  </header>

  <nav class="side" id="side"></nav>

  <main class="main">
    <div class="banner" id="banner" hidden></div>
    <div id="panel"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- current site content: used the first time, before anything is saved in the CMS -->
<script src="../data.js"></script>
<script src="../defaults.js"></script>
<script src="../firebase-config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
